<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <title>츄라 미쿠 스트리트 2026 현지 가이드</title>
  <style>
    :root {
      --teal: #0f766e; --teal-soft: #ccfbf1; --pink: #db2777; --ink: #0f172a; --muted: #64748b;
      --line: #e2e8f0; --bg: #f8fafc; --card: #fff; --ok: #15803d; --todo: #b45309; --est: #6366f1;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.6 -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      color: var(--ink); background: var(--bg); padding-bottom: calc(72px + env(safe-area-inset-bottom)); }
    header { background: linear-gradient(135deg, #0f766e, #14b8a6); color: #fff; padding: 18px 16px 14px; }
    header h1 { margin: 0; font-size: 19px; }
    header p { margin: 2px 0 0; font-size: 13px; opacity: .9; }
    .signage { margin-top: 10px; background: rgba(255,255,255,.16); border-radius: 10px; padding: 8px 12px; font-size: 13px; }
    .signage b { font-size: 15px; }
    main { padding: 12px; max-width: 640px; margin: 0 auto; }
    .view { display: none; } .view.on { display: block; }
    h2 { font-size: 16px; margin: 18px 4px 8px; }
    .chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 8px; }
    .chip { flex: none; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 12px; font-size: 13px; color: var(--ink); }
    .chip.on { background: var(--teal); border-color: var(--teal); color: #fff; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; }
    .card.warn { border-color: #f59e0b; box-shadow: inset 4px 0 0 #f59e0b; }
    .card h3 { margin: 0; font-size: 16px; }
    .ja { color: var(--muted); font-size: 13px; }
    .tags { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0 4px; }
    .tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--teal-soft); color: var(--teal); font-weight: 600; }
    .tag.must { background: #fce7f3; color: var(--pink); }
    .hours { font-size: 13px; margin: 4px 0; }
    ul.notes { margin: 6px 0 0; padding: 0; list-style: none; font-size: 13px; }
    ul.notes li { margin: 3px 0; display: flex; gap: 6px; align-items: baseline; }
    .st { flex: none; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 6px; color: #fff; }
    .st.ok { background: var(--ok); } .st.todo { background: var(--todo); } .st.est { background: var(--est); }
    .st.rev { background: #0369a1; }
    .sources a { color: var(--teal); }
    .actions { display: flex; gap: 8px; margin-top: 10px; }
    .btn { flex: 1; text-align: center; border: 1px solid var(--teal); color: var(--teal); background: #fff; border-radius: 10px;
      padding: 9px 0; font-size: 14px; font-weight: 600; text-decoration: none; }
    .btn.fill { background: var(--teal); color: #fff; }
    .map { margin-top: 10px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
    .map iframe { display: block; width: 100%; height: 260px; border: 0; }
    .stamp { display: flex; align-items: center; gap: 6px; font-size: 13px; margin-top: 8px; }
    .stamp input { width: 18px; height: 18px; accent-color: var(--teal); }
    .progress { font-size: 13px; color: var(--muted); margin: 0 4px 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    td { padding: 8px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
    td.price { text-align: right; white-space: nowrap; font-weight: 600; }
    .phrase .pja { font-size: 18px; font-weight: 600; }
    .phrase .pko { color: var(--teal); font-size: 14px; }
    .phrase .pmean { color: var(--muted); font-size: 13px; }
    .phrase.big .pja { font-size: 30px; line-height: 1.4; }
    nav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: #fff; border-top: 1px solid var(--line);
      padding-bottom: env(safe-area-inset-bottom); }
    nav button { flex: 1; border: 0; background: none; padding: 10px 0 12px; font-size: 13px; color: var(--muted); }
    nav button.on { color: var(--teal); font-weight: 700; }
    .mymaps iframe { height: 420px; }
    .small { font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>츄라 미쿠 스트리트 2026</h1>
    <p id="period"></p>
    <div class="signage" id="signage"></div>
  </header>

  <main>
    <section class="view on" id="v-places">
      <div class="chips" id="filters"></div>
      <p class="progress" id="stamp-progress"></p>
      <div id="place-list"></div>
      <div id="mymaps"></div>
    </section>

    <section class="view" id="v-food">
      <h2>콜라보 메뉴 <span class="small">세금 포함 · 주문하면 노벨티 카드</span></h2>
      <div class="card"><table id="menu-table"></table></div>
      <h2>굿즈 · 과자</h2>
      <div class="card"><table id="goods-table"></table></div>
      <div class="card"><ul class="notes" id="goods-notes"></ul></div>
    </section>

    <section class="view" id="v-ja">
      <h2>일본어 <span class="small">문장을 누르면 크게 보여요</span></h2>
      <div id="phrase-list"></div>
      <p class="small" id="words"></p>
    </section>

    <section class="view" id="v-notice">
      <h2>확인할 것 · 참고</h2>
      <div class="card"><ul class="notes" id="notice-list"></ul></div>
      <p class="small">상태 표시: <span class="st ok">확인됨</span> 공식 자료 · <span class="st rev">후기</span> X·인스타 방문자 후기 ·
        <span class="st todo">미확인</span> 확인 필요 · <span class="st est">추정</span> AI 추정</p>
      <p class="small sources" id="sources"></p>
    </section>
  </main>

  <nav>
    <button class="on" data-view="v-places">장소</button>
    <button data-view="v-food">메뉴·굿즈</button>
    <button data-view="v-ja">일본어</button>
    <button data-view="v-notice">확인할 것</button>
  </nav>

  <!-- data.js를 고치면 v 숫자를 올린다(휴대폰이 예전 데이터를 캐시에서 쓰지 않게). -->
  <script src="data.js?v=3"></script>
  <script>
    const TAG_LABEL = { stamp: '스탬프', ar: 'AR', panel: '등신대 패널', menu: '콜라보 메뉴', shop: '굿즈' };
    const ST_LABEL = { ok: '확인됨', rev: '후기', todo: '미확인', est: '추정' };
    const STAMP_KEY = 'chura-miku-stamps';
    const $ = (s) => document.querySelector(s);
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const yen = (n) => (n == null ? '가격 미확인' : '¥' + n.toLocaleString('ja-JP'));
    const stBadge = (st) => `<span class="st ${st}">${ST_LABEL[st]}</span>`;
    const embedQuery = (p) => (p.pinByCoords ? `${p.lat},${p.lng}` : p.q);
    const embedUrl = (p) => `https://maps.google.com/maps?q=${encodeURIComponent(embedQuery(p))}&z=${CONFIG.mapZoom}&output=embed`;
    // query_place_id가 있으면 Google 지도 앱이 검색 결과 대신 그 장소를 바로 연다.
    const appUrl = (p) => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.q)}`
      + (p.pid ? `&query_place_id=${encodeURIComponent(p.pid)}` : '');

    let filter = 'all';
    const stamps = new Set(JSON.parse(localStorage.getItem(STAMP_KEY) || '[]'));

    function renderFilters() {
      const keys = ['all', 'stamp', 'menu', 'ar', 'panel', 'shop'];
      $('#filters').innerHTML = keys.map((k) =>
        `<button class="chip ${k === filter ? 'on' : ''}" data-f="${k}">${k === 'all' ? '전체' : TAG_LABEL[k]}</button>`).join('');
    }

    function placeCard(p) {
      const tags = (p.must ? '<span class="tag must">꼭 가기</span>' : '') + p.tags.map((t) => `<span class="tag">${TAG_LABEL[t]}</span>`).join('');
      const notes = p.notes.map((n) => `<li>${stBadge(n.st)}<span>${esc(n.t)}</span></li>`).join('');
      const stamp = p.tags.includes('stamp')
        ? `<label class="stamp"><input type="checkbox" data-stamp="${p.id}" ${stamps.has(p.id) ? 'checked' : ''}> 스탬프 찍음</label>` : '';
      return `<article class="card ${p.warn ? 'warn' : ''}">
        <h3>${esc(p.name)}</h3><div class="ja">${esc(p.ja)} · ${esc(p.area)}</div>
        <div class="tags">${tags}</div>
        ${p.hours ? `<div class="hours">🕒 ${esc(p.hours)}</div>` : ''}
        ${notes ? `<ul class="notes">${notes}</ul>` : ''}
        ${stamp}
        <div class="actions">
          <button class="btn" data-map="${p.id}">지도 보기</button>
          <a class="btn fill" href="${appUrl(p)}" target="_blank" rel="noopener">Google 지도 앱</a>
        </div>
        <div class="map" id="map-${p.id}" hidden></div>
      </article>`;
    }

    function renderPlaces() {
      const list = filter === 'all' ? P : P.filter((p) => p.tags.includes(filter));
      $('#place-list').innerHTML = list.map(placeCard).join('');
      const total = P.filter((p) => p.tags.includes('stamp')).length;
      $('#stamp-progress').textContent = `스탬프 ${stamps.size} / ${total}곳`;
    }

    // iframe은 '지도 보기'를 누를 때만 만든다(처음 열 때 데이터를 아끼려고).
    function toggleMap(id) {
      const box = $('#map-' + id);
      if (!box.firstChild) {
        const p = P.find((x) => x.id === id);
        box.innerHTML = `<iframe src="${embedUrl(p)}" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="${esc(p.name)} 지도"></iframe>`;
      }
      box.hidden = !box.hidden;
    }

    function renderMyMaps() {
      if (!CONFIG.MYMAPS) return;
      $('#mymaps').innerHTML = `<h2>내 지도</h2><div class="card map mymaps"><iframe src="${esc(CONFIG.MYMAPS)}" loading="lazy" title="내 지도"></iframe></div>`;
    }

    function renderFood() {
      const placeName = (id) => P.find((p) => p.id === id).ja;
      $('#menu-table').innerHTML = MENU.map((m) =>
        `<tr><td><b>${esc(m.ja)}</b><div class="ja">${esc(m.ko)} · ${esc(placeName(m.place))}</div></td><td class="price">${yen(m.price)}</td></tr>`).join('');
      $('#goods-table').innerHTML = G.map((g) =>
        `<tr><td><b>${esc(g.ja)}</b><div class="ja">${esc(g.ko)}</div></td>`
        + `<td class="price">${g.each ? '각 ' : ''}${yen(g.price)}${g.st === 'ok' ? '' : '<br>' + stBadge(g.st)}</td></tr>`).join('');
      $('#goods-notes').innerHTML = GN.map((n) => `<li>${stBadge(n.st)}<span>${esc(n.t)}</span></li>`).join('');
    }

    function renderPhrases() {
      $('#phrase-list').innerHTML = PH.map((ph, i) =>
        `<div class="card phrase" data-ph="${i}"><div class="pja" lang="ja">${esc(ph.ja)}</div><div class="pko">${esc(ph.ko)}</div><div class="pmean">${esc(ph.mean)}</div></div>`).join('');
      $('#words').textContent = WORDS;
    }

    function renderNotices() {
      $('#notice-list').innerHTML = NOTICES.map((n) => `<li>${stBadge(n.st)}<span>${esc(n.t)}</span></li>`).join('');
      $('#sources').innerHTML = '출처: ' + SOURCES.map((s) => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a>`).join(' · ')
        + '. 행사 내용은 예고 없이 바뀔 수 있어요.';
    }

    // 일본 시간(UTC+9) 기준 다음 전광판 시보까지 남은 시간.
    function nextSignage(now = new Date()) {
      const jst = new Date(now.getTime() + 9 * 3600e3);
      const sec = jst.getUTCHours() * 3600 + jst.getUTCMinutes() * 60 + jst.getUTCSeconds();
      for (let d = 0; d < 2; d++) {
        for (const h of CONFIG.signageHours) {
          const start = d * 86400 + h * 3600 - CONFIG.signageLeadSec;
          if (sec < start + CONFIG.signageLengthSec) return { h, wait: Math.max(0, start - sec), live: sec >= start };
        }
      }
    }

    function renderSignage() {
      const s = nextSignage();
      const hh = String(s.h).padStart(2, '0');
      const m = Math.floor(s.wait / 60), sec = s.wait % 60;
      $('#signage').innerHTML = s.live
        ? `📺 국제거리 전광판 시보 <b>지금 방송 중</b> (${hh}:00)`
        : `📺 다음 전광판 시보 <b>${hh}:00</b> (${String(s.h - 1).padStart(2, '0')}:59:45부터 30초) · ${m}분 ${String(sec).padStart(2, '0')}초 남음`;
    }

    document.addEventListener('click', (e) => {
      const t = e.target.closest('[data-f],[data-map],[data-view],[data-ph]');
      if (!t) return;
      if (t.dataset.f) { filter = t.dataset.f; renderFilters(); renderPlaces(); }
      if (t.dataset.map) toggleMap(t.dataset.map);
      if (t.dataset.ph) t.classList.toggle('big');
      if (t.dataset.view) {
        document.querySelectorAll('.view').forEach((v) => v.classList.toggle('on', v.id === t.dataset.view));
        document.querySelectorAll('nav button').forEach((b) => b.classList.toggle('on', b === t));
        window.scrollTo(0, 0);
      }
    });

    document.addEventListener('change', (e) => {
      const id = e.target.dataset.stamp;
      if (!id) return;
      e.target.checked ? stamps.add(id) : stamps.delete(id);
      localStorage.setItem(STAMP_KEY, JSON.stringify([...stamps]));
      renderPlaces();
    });

    $('#period').textContent = `행사 ${CONFIG.eventStart} ~ ${CONFIG.eventEnd} · 국제거리 · 슈리 · 정보 기준일 ${CONFIG.infoDate}`;
    renderFilters(); renderPlaces(); renderMyMaps(); renderFood(); renderPhrases(); renderNotices();
    renderSignage(); setInterval(renderSignage, 1000);
  </script>
</body>
</html>
